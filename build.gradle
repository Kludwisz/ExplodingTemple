plugins {
    id("java")
    id("application")
}

group = "com.kris.seedfinding"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
    maven { url="https://maven.seedfinding.com" }
    maven { url="https://maven.xpple.dev/maven2" }
}

dependencies {
    implementation("com.seedfinding:mc_math:1.171.0")
    implementation("com.seedfinding:mc_seed:1.171.2")
    implementation("com.seedfinding:mc_core:1.210.0")
    implementation("com.seedfinding:mc_noise:1.171.1")
    implementation("com.seedfinding:mc_biome:1.171.1")
    implementation("com.seedfinding:mc_terrain:1.171.1")
    implementation("com.seedfinding:mc_reversal:1.171.1")
    implementation("com.seedfinding:mc_feature:1.171.10")

    implementation files('lib/profotoce59-1.0-SNAPSHOT.jar')

    implementation("dev.xpple:cubiomes:0.0.0-2026.5.18.1779128583+1a0c27a6b80f6bebbfe18b806af70fe18f33d0c4")
}

// gradlew run --args="seedMin seedMax maxSpawnDistance [threads] [worstShaftExit]", see Main
application {
    mainClass = "Main"
    // cubiomes calls its native library through Java's foreign function API
    applicationDefaultJvmArgs = ["--enable-native-access=ALL-UNNAMED"]
}